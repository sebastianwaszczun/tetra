name: back

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "modules/**"
      - "config/**"
      - "scripts/**"
      - "db/**"
      - "requirements.txt"
      - "constraints.txt"
      - "Dockerfile"
      - "docker-compose.prod.yml"
      - ".github/workflows/back.yml"
  pull_request:
    paths:
      - "src/**"
      - "modules/**"
      - "config/**"
      - "scripts/**"
      - "db/**"
      - "requirements.txt"
      - "constraints.txt"
      - "Dockerfile"
      - "docker-compose.prod.yml"
      - ".github/workflows/back.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Składnia Pythona
        run: python -m compileall -q src modules scripts
      - name: Compose
        env:
          DOMAIN: example.com
          POSTGRES_PASSWORD: ci
          NEO4J_PASSWORD: ci
        run: docker compose -f docker-compose.prod.yml config -q

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.VPS_HOST != ''
    runs-on: ubuntu-24.04
    steps:
      - name: SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy api
        run: |
          ssh -i ~/.ssh/id_deploy "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" \
            'set -e; cd ~/tetra; git pull --ff-only; docker compose up -d --build api; docker image prune -f'
