name: fakecollector

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
      POSTGRES_DB: ${POSTGRES_DB:-fakecollector}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fake} -d ${POSTGRES_DB:-fakecollector}"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?ustaw NEO4J_PASSWORD w .env}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    image: fakecollector-app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: uvicorn fakecollector.api.main:app --host 0.0.0.0 --port 8000 --workers 1 --root-path /api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fake}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fakecollector}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      CORS_ORIGINS: https://${DOMAIN:?ustaw DOMAIN w .env}
      PYTHONPATH: /workspace/src:/workspace/modules
      STORE_DIR: /workspace/data/store
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      ADLIB_TRYB: ${ADLIB_TRYB:-na_zywo}
      ADLIB_ANALYZE_URL: http://localhost:8000/analyze
    volumes:
      - ./src:/workspace/src
      - ./modules:/workspace/modules
      - ./scripts:/workspace/scripts
      - ./config:/workspace/config
      - ./data:/workspace/data
      - models:/models
    shm_size: "2gb"

  scheduler:
    image: fakecollector-app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    command: python -m fakecollector.worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fake}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fakecollector}
      PYTHONPATH: /workspace/src:/workspace/modules
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      ADLIB_TRYB: ${ADLIB_TRYB:-na_zywo}
      ADLIB_ANALYZE_URL: http://api:8000/analyze
    volumes:
      - ./src:/workspace/src
      - ./modules:/workspace/modules
      - ./data:/workspace/data
      - ./config:/workspace/config

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: fakecollector-web:latest
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  neo4jdata:
  models:
  caddy_data:
  caddy_config:
